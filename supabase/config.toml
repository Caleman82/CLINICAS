# Configuración para el entorno local de Supabase (`npx supabase start`).
# En el proyecto de producción, estos mismos valores se configuran en el dashboard
# (ver docs/produccion.md). Solo se listan las claves relevantes; el resto usa los
# valores por defecto de la CLI.
project_id = "clinicas"

[api]
enabled = true
port = 54321
# Solo se expone public. El esquema `app` (funciones internas) NO se expone.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
# Sesiones: el token de acceso dura 1 hora; se refresca mientras la sesión siga válida.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# NO hay registro libre: solo el servidor crea usuarios.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8
# El requisito "al menos un número" se valida en la app (Supabase no tiene "solo dígitos").
password_requirements = ""

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true

[auth.sms]
enable_signup = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
